name: Ralawise Daily Scheduled Sync

on:
  schedule:
    # Check hourly so admin-configured custom times (e.g. 14:00 UK) trigger accurately
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force execution even if not due'
        required: false
        default: false
        type: boolean

jobs:
  scheduled-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Ralawise Headless Orchestrator
        env:
          WOOAPP_URL: ${{ secrets.WOOAPP_URL || 'https://wooapp.southline.co.uk' }}
          RALAWISE_SYNC_CRON_SECRET: ${{ secrets.RALAWISE_SYNC_CRON_SECRET }}
        run: |
          if [ -z "$RALAWISE_SYNC_CRON_SECRET" ]; then
            echo "RALAWISE_SYNC_CRON_SECRET is not configured in GitHub Secrets. Exiting safely."
            exit 0
          fi
          
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_run }}" = "true" ] || [ "${{ github.event.inputs.force_run }}" = "true" ]; then
              FORCE_FLAG="--force"
            fi
          fi
          
          echo "Executing Ralawise headless orchestrator (force_flag=$FORCE_FLAG)..."
          node scripts/run-ralawise-headless-sync.js $FORCE_FLAG
