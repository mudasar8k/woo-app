name: Ralawise Daily Scheduled Sync

on:
  schedule:
    # Check hourly so admin-configured custom times (e.g. 14:00 UK) trigger accurately
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force execution even if not due'
        required: false
        default: false
        type: boolean

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check & Trigger Scheduled Sync
        run: |
          WOOAPP_URL="${{ secrets.WOOAPP_URL || 'https://wooapp.southline.co.uk' }}"
          CRON_SECRET="${{ secrets.RALAWISE_SYNC_CRON_SECRET }}"
          
          if [ -z "$CRON_SECRET" ]; then
            echo "RALAWISE_SYNC_CRON_SECRET is not configured in GitHub Secrets. Exiting safely."
            exit 0
          fi
          
          FORCE_VAL="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_run }}" = "true" ] || [ "${{ github.event.inputs.force_run }}" = "true" ]; then
              FORCE_VAL="true"
            fi
          fi
          
          echo "Triggering Ralawise scheduled sync check against $WOOAPP_URL (force=$FORCE_VAL)..."
          RESPONSE=$(curl -s -X POST "$WOOAPP_URL/api/ralawise/scheduled-sync/check" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"force\": $FORCE_VAL}")
          
          echo "Response from WooApp:"
          echo "$RESPONSE"
